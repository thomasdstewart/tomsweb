# All available Hugo versions are listed here: https://gitlab.com/pages/hugo/container_registry
image: registry.gitlab.com/pages/hugo/hugo_extended:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  script:
  - hugo
  except:
  - master

pages:
  script:
    - apk add go git
    - hugo version
    - hugo mod graph
    - hugo --debug
  artifacts:
    paths:
    - public
  only:
  - master
